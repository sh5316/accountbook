      bindSegs(root, st, () => { tab = st.imp; mountBody(); });
      mountBody();
      root.addEventListener("change", e => {
        if (e.target.id === "skipPast") {

          root.querySelectorAll("[data-pi]").forEach(c => { const it = items[c.dataset.pi]; if (!it.err && it.rep === "none" && it.date < t) c.checked = !e.target.checked; });

          for (let i = 0; i < presets.length; i++) {
            const c = $("#pc-" + i, root); if (!c || !c.checked) continue;
            const p = presets[i]; const title = $("#pt-" + i, root).value.trim() || p.title;
            const day = Number($("#pd-" + i, root).value), month = p.rep === "yearly" ? Number($("#pm-" + i, root).value) : 1;
            if (!(day >= 1 && day <= 31) || !(month >= 1 && month <= 12) || day > daysIn(2024, month)) { showErr(`'${title}'의 날짜를 확인해 주세요.`); return; }
            picked.push({ title, rep: p.rep, day, month, tag: p.tag, who: p.who || "joint", time: "", memo: "", start: "" });
          }
          if (!picked.length) { showErr("등록할 일정을 하나 이상 골라 주세요."); return; }
        } else {
          picked = [...root.querySelectorAll("[data-pi]:checked")].map(c => items[c.dataset.pi]);
          if (!picked.length) { showErr("먼저 파일을 올리고 가져올 일정을 골라 주세요."); return; }
        }
        showErr("");
        const go = $("#iGo", root); go.disabled = true;
        const prog = $("#iProg", root);
        let res = null;
        const ok = await write(async () => { res = await writeImports(picked, n => { prog.textContent = `등록하는 중 ${n}/${picked.length}`; }); });
        go.disabled = false;
        if (ok) {
          closeModal();
          showBanner(`일정 ${res.done}개를 등록했어요.${res.skipped ? ` 이미 있는 일정 ${res.skipped}개는 건너뛰었어요.` : ""}`);
          subscribeMonth();
        } else if (res === null) prog.textContent = "";
      };
    });
  }

  // ---------- events ----------
  $("#prevM").onclick = () => { S.ym = shiftYm(S.ym, -1); subscribeMonth(); };
  $("#nextM").onclick = () => { S.ym = shiftYm(S.ym, 1); subscribeMonth(); };
  $("#todayBtn").onclick = () => { S.selDay = todayStr(); if (S.ym !== ymOf(S.selDay)) { S.ym = ymOf(S.selDay); subscribeMonth(); } else render(); };
  document.querySelector(".tabs").addEventListener("click", e => {
    const b = e.target.closest("button[data-tab]"); if (!b) return;
    S.tab = b.dataset.tab; lsSet("hb.tab", S.tab); render();
  });

  $("#view").addEventListener("click", async e => {
    const t = e.target;
    const todo = t.closest("[data-todo]");
    if (todo) { if (t === todo) { todo.disabled = true; if (!(await toggleTodo(todo.dataset.todo))) render(); } return; }
    const dn = t.closest("[data-done]");
    if (dn) { if (t === dn) { dn.disabled = true; if (!(await toggleDone(dn.dataset.done))) render(); } return; }
    if (t.closest("label.todo")) return;
    if (t.closest('[data-act="toggleHide"]')) { S.dHideDone = !S.dHideDone; render(); return; }
    const dd = t.closest("[data-dday]");
    if (dd) { S.dDay = S.dDay === dd.dataset.dday ? null : dd.dataset.dday; render(); return; }
    if (t.closest('[data-act="clearDday"]')) { e.preventDefault(); S.dDay = null; render(); return; }
    if (t.closest('[data-act="addDiary"]')) return diaryModal(null);
    const dcard = t.closest("[data-diary]");
    if (dcard) { const de = findDiary(dcard.dataset.diary); if (de) diaryModal(de); return; }
    const f = t.closest("[data-f]");
    if (f) { S[f.dataset.f] = f.dataset.v; render(); return; }
    const act = t.closest("[data-act]")?.dataset.act;
    if (act === "addTx") return txModal(null, S.tab === "cal" ? S.selDay : null);
    if (act === "addEv") return evModal(null, S.tab === "cal" ? S.selDay : (todayStr().startsWith(S.ym) ? todayStr() : `${S.ym}-01`), false);
    if (act === "import") return importModal();
    if (act === "backupSave") { try { await exportBackup(); $("#bkMsg").textContent = "백업 파일을 저장했어요"; } catch (err) { if (err?.code !== "declined") $("#bkMsg").textContent = "저장하지 못했어요."; } return; }
    if (act === "csvMonth") { try { await exportMonthCSV(); } catch (err) { if (err?.code !== "declined") $("#bkMsg").textContent = "저장하지 못했어요."; } return; }
    if (act === "saveMembers") {
      const a = $("#memA").value.trim() || "남편", b = $("#memB").value.trim() || "아내";
      if (await saveSettings({ ...S.settings, members: { a, b } })) $("#memSaved").textContent = "저장했어요";
      return;
    }
    if (act === "saveBudget") {
      const cats = {};
      document.querySelectorAll("[data-budcat]").forEach(i => { const v = parseAmt(i.value); if (v) cats[i.dataset.budcat] = v; });
      if (await saveSettings({ ...S.settings, budget: { total: parseAmt($("#bud-total").value), cats } })) $("#budSaved").textContent = "저장했어요";
      return;
    }
    const ac = t.closest("[data-addcat]");
    if (ac) {
      const type = ac.dataset.addcat; const inp = $("#newcat-" + type); const name = inp.value.trim();
      if (!name || S.settings.cats[type].includes(name)) return;
      const cats = { ...S.settings.cats, [type]: [...S.settings.cats[type], name] };
      await saveSettings({ ...S.settings, cats }); return;
    }
    const dc = t.closest("[data-delcat]");
    if (dc) {
      const type = dc.dataset.delcat; const arr = S.settings.cats[type].slice(); if (arr.length <= 1) return;
      arr.splice(Number(dc.dataset.i), 1);
      await saveSettings({ ...S.settings, cats: { ...S.settings.cats, [type]: arr } }); return;
    }
    const day = t.closest("[data-day]");
    if (day) {
      const d = day.dataset.day;
      if (ymOf(d) !== S.ym) { S.selDay = d; S.ym = ymOf(d); subscribeMonth(); return; }
      if (S.selDay === d && window.matchMedia("(min-width: 901px)").matches) { evModal(null, d, false); return; }
      S.selDay = d; render(); return;
    }
    const row = t.closest("[data-tx]");
    if (row) { const tx = S.tx.find(x => x.id === row.dataset.tx); if (tx) txModal(tx); return; }
    const ev = t.closest("[data-ev]");
    if (ev) {
      if (ev.dataset.rec === "1") { const r = S.recurring.find(x => x.id === ev.dataset.ev); if (r) evModal({ ...r, date: ev.dataset.date }, ev.dataset.date, true); }
      else { const x = S.events.find(x => x.id === ev.dataset.ev); if (x) evModal(x, null, false); }
    }
  });
  $("#view").addEventListener("keydown", e => {
    if (e.key === "Enter" && e.target.matches("[data-tx], [data-diary]")) e.target.click();
  });
  $("#view").addEventListener("submit", e => {
    if (e.target.id === "quickAdd") { e.preventDefault(); quickAdd(); }
  });
  $("#view").addEventListener("change", e => {
    if (e.target.id === "backupFile" && e.target.files[0]) { importBackup(e.target.files[0]); e.target.value = ""; }
  });
  $("#view").addEventListener("input", e => {
    if (e.target.id === "dSearch") { S.dQuery = e.target.value; $("#dList").innerHTML = diaryListHtml(); fillAvatars(); return; }
    if (e.target.matches(".bud-row input")) { const v = parseAmt(e.target.value); e.target.value = v ? v.toLocaleString("ko-KR") : ""; }
  });
  // tooltip for charts
  const tip = $("#tip");
  $("#view").addEventListener("pointermove", e => {
    const el = e.target.closest("[data-tip]");
    if (!el) { tip.hidden = true; return; }
    tip.textContent = el.dataset.tip; tip.hidden = false;
    const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
    tip.style.left = x + "px"; tip.style.top = (e.clientY - 34) + "px";
  });
  $("#view").addEventListener("pointerleave", () => { tip.hidden = true; });

  async function saveSettings(next) {
    const ok = await write(() => store.set("settings/main", next));
    if (ok) { S.settings = next; render(); }
    return ok;
  }

  // ---------- boot ----------
  let userApi = null, downloadsApi = null;
  let localDump = null, localReplace = null;
  function storageWorks() {
    try { localStorage.setItem("hb.test", "1"); localStorage.removeItem("hb.test"); return true; } catch { return false; }
  }
  // claude.ai에서는 downloads 기능으로, 파일로 열었을 때는 브라우저 다운로드로 저장
  const isFramed = (() => { try { return window.top !== window; } catch { return true; } })();
  const canSaveFile = () => !!downloadsApi || !isFramed;
  async function saveFile(filename, data, mime) {
    if (downloadsApi) { await downloadsApi.save({ filename, data }); return; }
    const url = URL.createObjectURL(new Blob([data], { type: mime }));
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  const csvCell = v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : String(v ?? "");

  async function exportMonthCSV() {
    const rows = S.tx.slice().sort((a, b) => a.date.localeCompare(b.date) || (a.at || 0) - (b.at || 0));
    const lines = [["날짜", "구분", "분류", "금액", "결제수단", "누구", "메모"].join(",")]
      .concat(rows.map(t => [t.date, TYPE_LABEL[t.type], t.cat, t.amount, t.method, whoName(t.who), t.memo].map(csvCell).join(",")));
    await saveFile(`myaccountbook-${S.ym}.csv`, "﻿" + lines.join("\n") + "\n", "text/csv");
  }
  async function exportBackup() {
    const body = { app: "myaccountbook", version: 1, exportedAt: new Date().toISOString(), data: localDump() };
    await saveFile(`myaccountbook-백업-${todayStr()}.json`, JSON.stringify(body, null, 1), "application/json");
  }
  async function importBackup(file) {
    const msg = $("#bkMsg");
    let body;
    try { body = JSON.parse(await readText(file)); } catch { body = null; }
    if (!body || body.app !== "myaccountbook" || typeof body.data !== "object") { msg.style.color = "var(--expense)"; msg.textContent = "myaccountbook 백업 파일이 아니에요."; return; }
    const entries = [];
    for (let [col, docs] of Object.entries(body.data)) {
      // 예전 '나만 보기' 다이어리는 공유 다이어리로 합침
      const priv = col.match(/^data\/users\/[^/]+\/m-(\d{4}-\d{2})\/diary$/);
      if (priv) col = `months/${priv[1]}/diary`;
      else if (!/^(settings|recurring|months\/\d{4}-\d{2}\/(tx|events|diary))$/.test(col) || typeof docs !== "object") continue;
      if (typeof docs !== "object") continue;
      for (const [id, doc] of Object.entries(docs)) if (/^[A-Za-z0-9_-]{1,64}$/.test(id) && doc && typeof doc === "object") entries.push([col, id, doc]);
    }
    if (!entries.length) { msg.textContent = "백업 파일에 불러올 기록이 없어요."; return; }
    msg.style.color = ""; msg.textContent = `불러오는 중… 0/${entries.length}`;
    if (S.mode !== "shared" && localReplace) {
      const merged = localDump();
      for (const [col, id, doc] of entries) (merged[col] ||= {})[id] = doc;
      localReplace(merged);
    } else {
      let n = 0;
      const ok = await write(async () => { for (const [col, id, doc] of entries) { await store.set(`${col}/${id}`, doc); msg.textContent = `불러오는 중… ${++n}/${entries.length}`; } });
      if (!ok) { msg.textContent = ""; return; }
      subscribeMonth();
    }
    showBanner(`백업에서 기록 ${entries.length}개를 불러왔어요.`);
  }
  function start(useLocal) {
    store = useLocal ? makeLocalStore() : store;
    store.subDoc("settings/main", d => {
      const base = structuredClone(DEFAULT_SETTINGS);
      if (d) {
        base.members = { ...base.members, ...(d.members || {}) };
        if (d.cats) base.cats = { ...base.cats, ...d.cats };
        if (d.methods) base.methods = d.methods;
        if (d.budget) base.budget = { total: d.budget.total || 0, cats: d.budget.cats || {} };
      }
      S.settings = base; render();
    });
    store.subCol("recurring", rows => { S.recurring = rows; render(); });
    subscribeMonth();
  }

  render();
  (async () => {
    const claude = window.claude;
    const [db, user, downloads] = claude?.use ? await Promise.all([claude.use("db"), claude.use("user"), claude.use("downloads")]) : [null, null, null];
    userApi = user; downloadsApi = downloads;
    if (user) {
      const me = await user.me();
      S.uid = me.id;
      if (me.id) $("#meBox").innerHTML = `<img alt="" src="${esc(me.avatarUrl)}"><span>${esc(me.name || "나")}</span>`;
      const can = await user.can("data.write");
      if (can === false) setReadOnly();
    }
    if (db) { S.mode = "shared"; store = makeDbStore(db); start(false); }
    else {
      S.mode = "local";
      if (!storageWorks()) showBanner("이 브라우저는 파일로 연 페이지의 저장을 막고 있어요. 새로고침하면 기록이 사라지니 Chrome이나 Edge로 열어 주세요.");
      else if (!claude) showBanner("이 파일에 적은 내용은 지금 쓰는 브라우저에만 저장돼요. 다른 기기로 옮기거나 지켜 두려면 설정 탭에서 백업 파일을 저장하세요.");
      else showBanner("공유 저장소에 연결되지 않아 지금은 이 브라우저에만 저장돼요. claude.ai에 로그인한 상태로 열면 부부가 함께 쓸 수 있어요.");
      start(true);
    }
  })();
})();
</script>
</body>
</html>
